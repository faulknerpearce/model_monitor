name: ModelMonitor
options:
  bundleIdPrefix: com.modelmonitor
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
targets:
  ModelMonitor:
    type: application
    platform: macOS
    sources:
      - path: ModelMonitor
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.modelmonitor.app
        PRODUCT_NAME: Model Monitor
        PRODUCT_MODULE_NAME: ModelMonitor
        INFOPLIST_FILE: ModelMonitor/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ModelMonitor/Resources/ModelMonitor.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        PRIVACY_MANIFEST_FILE: ModelMonitor/Resources/PrivacyInfo.xcprivacy
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
    entitlements:
      path: ModelMonitor/Resources/ModelMonitor.entitlements
  ModelMonitorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ModelMonitorTests
    dependencies:
      - target: ModelMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.modelmonitor.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Model Monitor.app/Contents/MacOS/Model Monitor"
        BUNDLE_LOADER: "$(TEST_HOST)"
        ENABLE_TESTING_SEARCH_PATHS: YES
schemes:
  ModelMonitor:
    build:
      targets:
        ModelMonitor: all
        ModelMonitorTests: [test]
    test:
      targets:
        - ModelMonitorTests
    run:
      config: Debug
