name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: macOS tests
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcode-select -p
          xcrun --find swiftc
          xcrun --sdk macosx --show-sdk-path
          swift --version

      - name: Core parser tests (no app host)
        run: ./Scripts/run_core_tests.sh

      - name: Xcode unit tests
        run: |
          xcodebuild \
            -project ModelMonitor.xcodeproj \
            -scheme ModelMonitor \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            test
