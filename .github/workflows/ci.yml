name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: macOS tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Core parser tests (no app host)
        run: ./Scripts/run_core_tests.sh

      - name: Xcode unit tests
        run: |
          xcodebuild \
            -project ModelMonitor.xcodeproj \
            -scheme ModelMonitor \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            test
