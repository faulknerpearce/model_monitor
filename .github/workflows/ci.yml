name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Hosted XCTest (`make test` / xcodebuild) needs a newer Xcode than macos-14
# ships for this project format. Keep full unit tests local via `make test`.
# CI runs the Makefile CLT suite only.
jobs:
  test:
    name: macOS core tests
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcode-select -p
          xcrun --find swiftc
          xcrun --sdk macosx --show-sdk-path
          swift --version

      - name: Core parser tests
        run: make test-core
