codecov:
  require_ci_to_pass: false

coverage:
  status:
    # Project-wide coverage stays informational until the poller/auth suites land.
    project:
      default:
        informational: true
    patch:
      default:
        target: 50%
        only_pulls: true

# UI-heavy files where XCTest coverage is not meaningful. Covers SwiftUI files that
# don't happen to end in "View.swift" too (bars, rows, charts) — keep this in sync
# when adding a new UI-only file that doesn't match one of these suffixes.
ignore:
  - "TokenMon/App/AppDelegate.swift"
  - "TokenMon/Features/**/*View.swift"
  - "TokenMon/Features/**/*Bar.swift"
  - "TokenMon/Features/**/*Row.swift"
  - "TokenMon/Features/**/*Chart.swift"
  - "Tests/Manual/**"
